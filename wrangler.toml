# Cloudflare Pages configuration (config-as-code)
# The dashboard picks this up once the project is connected to the repo.
name = "golftour-claude"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-21"

# Secrets (set in dashboard -> Workers & Pages -> golftour-claude -> Settings
# -> Variables and Secrets, type "Secret", Production + Preview):
#   GOLFBOX_USER, GOLFBOX_PASS, SYNC_TOKEN, SUPABASE_URL, SUPABASE_SERVICE_KEY
# Build-time public vars (type "Plaintext"):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
